<!--
  Murmur wordmark. The mark is the five-bar waveform from the shipping app icon
  (src-tauri/icons/icon.svg) and the shell's brand tile — this file used to carry the
  pre-2.0 orb-and-ripples mark, which the product stopped using.
  Colours are the literal tokens from src/design-tokens/colors.css.
-->
<svg width="1080" height="300" viewBox="0 0 1080 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bars" x1="60" y1="76" x2="240" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa0ff"/>
      <stop offset="1" stop-color="#c79bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="150" cy="150" r="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b82ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b82ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="barGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- mark: the five-bar waveform, same proportions as the app icon -->
  <circle cx="150" cy="150" r="112" fill="url(#glow)"/>
  <g fill="url(#bars)" filter="url(#barGlow)" opacity="0.75">
    <rect x="66"  y="128" width="24" height="44"  rx="12"/>
    <rect x="106" y="103" width="24" height="94"  rx="12"/>
    <rect x="146" y="78"  width="24" height="144" rx="12"/>
    <rect x="186" y="103" width="24" height="94"  rx="12"/>
    <rect x="226" y="128" width="24" height="44"  rx="12"/>
  </g>
  <g fill="url(#bars)">
    <rect x="66"  y="128" width="24" height="44"  rx="12"/>
    <rect x="106" y="103" width="24" height="94"  rx="12"/>
    <rect x="146" y="78"  width="24" height="144" rx="12"/>
    <rect x="186" y="103" width="24" height="94"  rx="12"/>
    <rect x="226" y="128" width="24" height="44"  rx="12"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="312" y="170"
        font-family="'Hanken Grotesk', -apple-system, system-ui, sans-serif"
        font-size="132" font-weight="600" letter-spacing="-5" fill="#f6f6fa">murmur</text>
  <text x="316" y="226"
        font-family="'Hanken Grotesk', -apple-system, system-ui, sans-serif"
        font-size="31" font-weight="500" letter-spacing="0.5" fill="#9a9aa7">on-device meeting notes</text>
</svg>
