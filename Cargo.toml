# Virtual workspace root (introduced for the brain-sidecar extraction, 2026-07-11).
#
# WHY a workspace: the on-device GGUF LLM (mistralrs) was extracted out of the app crate into its
# OWN member crate (`crates/murmur-brain`) compiled to a killable helper binary `murmur-brain`.
# The app crate (`src-tauri`, package `murmur`) NO LONGER depends on mistralrs — so `cargo test --lib`
# stops compiling the largest single ML tree, and (the real point) the multi-GB model residency +
# mistralrs drop-leaks (#723/#865) + uncancellable generation now live in a child process whose RAM
# the OS reclaims in full on kill (idle-unload / timeout / quit).
#
# The murmur-protocol path-dep (../../murmur-server/crates/murmur-protocol) lives OUTSIDE this repo
# in a SEPARATE workspace — a path-dependency, never a member here, so it is unaffected.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/murmur-brain"]
# Keep the inner loop + `cd src-tauri && cargo ...` (CI / release / `npm run dev`) building ONLY the
# app crate by default; the brain sidecar is built explicitly (beforeBuildCommand / `-p murmur-brain`).
default-members = ["src-tauri"]

# Dependencies carry NO debuginfo in dev/test builds. The app test binary statically links a large
# native/ML tree (candle, whisper-rs, sherpa-onnx, sqlcipher, openssl, tauri) and the default
# `debug = 2` builds full DWARF for EVERY dependency — which linkers do NOT tree-shake, so it is the
# bulk of both the multi-hundred-GB `target/` and the ~15-20 GB link-time memory peak of a single
# `cargo test --lib`. Several of those links at once pinned the macOS memory compressor and froze the
# whole UI (root-cause writeup: docs/research/2026-07-18-build-ram-freeze.md). Stripping dependency
# debuginfo cuts ~30-40% of incremental compile time and most of that link RAM. OUR OWN crates keep
# line-table debuginfo below, so panic backtraces retain file:line locations. Any release-profile
# tuning belongs in its own `[profile.release]` section and does not change these dev-only settings.
[profile.dev.package."*"]
debug = false

# SQLCipher's C amalgamation is the hot path of the test suite and of every app DB read. The `cc`
# crate compiles it at the profile's OPT_LEVEL, so a dev/test build shipped it at `-O0`. Measured on
# the 399-test `storage::db` module: 150.5 s at -O0 vs 124.2 s at -O3 (-17%). This is a DEV/TEST-only
# profile knob — `[profile.release]` already builds every dependency optimized, so the shipped
# binary is unaffected. Cost is a one-time recompile of libsqlite3-sys (~1 min); it is a leaf C
# crate, so nothing else rebuilds with it.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Our own workspace crates keep line-level debuginfo (file:line in backtraces) without the full
# `debug = 2` weight — a light middle ground for the code we actually debug locally.
[profile.dev]
debug = "line-tables-only"

# Shipped binaries favor steady-state performance and size. Workspace profiles belong at this
# virtual root (putting this in src-tauri/Cargo.toml would be ignored by Cargo).
[profile.release]
lto = true
codegen-units = 1
strip = true
