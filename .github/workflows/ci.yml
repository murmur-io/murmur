name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Murmur PR gate. `scripts/ci.sh` is the SINGLE SOURCE OF TRUTH for what "green"
# means; this workflow only WRAPS it on a macOS runner (swiftc / whisper.cpp Metal /
# ScreenCaptureKit are macOS-only, so Linux runners cannot mirror the gate).
#
# RELEASE PARITY (2026-07-05): every PR runs the COMPLETE ci.sh — the exact gate
# the release preflight (/release-murmur) requires — including the headless audio
# E2E. The whisper model (~142 MB) is cached between runs and ffmpeg is a one-line
# brew install, so parity costs little after the first run. `MURMUR_CI_SKIP_E2E=1`
# remains a LOCAL iteration convenience only — CI never sets it.
#
# Node comes from `.nvmrc` (24.18.0) — Angular 22's CLI refuses Node < 24.15, so
# the version is pinned in ONE place shared by CI and local nvm users.
#
# To change WHAT CI enforces, edit `scripts/ci.sh` — never duplicate its command
# list here (that is how the two drift). See .claude/skills/add-ci-gate.
# Owned by the ci-cd-engineer agent.
#
# NOTE ON HONESTY: real mic capture, live ScreenCaptureKit, Touch ID, lock-at-rest,
# and notarization CANNOT run headless in CI — they need a signed build on a real
# Mac. CI proves compile/test/lint/build/supply-chain + the headless audio pipeline,
# NOT those. Release/notarization stays with the release-engineer agent.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [murmur]
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — a weekly gate run on the default branch (catches
    # environment drift: new runner images, toolchain updates, cache decay).
    - cron: "0 6 * * 1"

# Least privilege: the gate only reads the repo. No write scopes.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a PR kills the old run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Defer Metal-shader precompile to first runtime use (never happens in a headless
  # build/test). Mirrors scripts/ci.sh; harmless even where full Xcode is present.
  MISTRALRS_METAL_PRECOMPILE: "0"
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (full ci.sh — release parity)
    # macOS is MANDATORY: swiftc ScreenCaptureKit sidecar typecheck + whisper.cpp Metal.
    # macos-14 = Apple Silicon, matching the dev Mac's arch and the release target.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # src-tauri/Cargo.toml has a PATH dependency on the murmur-protocol crate in
      # the (private) sibling repo: ../../murmur-server/crates/murmur-protocol.
      # The default GITHUB_TOKEN cannot read another private repo, so the clone
      # authenticates with a READ-ONLY deploy key stored as the repo secret
      # MURMUR_SERVER_DEPLOY_KEY (public half registered on murmur-server).
      # Without it every cargo step fails at metadata: "failed to get murmur-protocol".
      - name: Checkout murmur-server (murmur-protocol path dep — read-only deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.MURMUR_SERVER_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::secret MURMUR_SERVER_DEPLOY_KEY is missing — register the read-only deploy key on murmur-server and add its private half as this secret (see the comment above this step)"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/murmur_server_ci
          chmod 600 ~/.ssh/murmur_server_ci
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/murmur_server_ci -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:murmur-io/murmur-server.git "${GITHUB_WORKSPACE}/../murmur-server"

      - name: Setup Node (version from .nvmrc — Angular 22 needs >= 24.15)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain (rust-toolchain.toml → 1.96.0 + clippy/rustfmt)
        run: rustup show

      - name: Cache Rust build (registry + git + src-tauri/target)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install cargo-audit + cargo-deny (prebuilt — skips ci.sh's slow cargo install)
        uses: taiki-e/install-action@678b06b887cdbf44fa0601e5915f865e17c2241d # v2.44.60
        with:
          tool: cargo-audit,cargo-deny

      - name: Install ffmpeg (audio E2E — aiff to 16 kHz mono WAV)
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Cache whisper model (ggml-base.en.bin, ~142 MB)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Application Support/MeetNotes/models
          key: whisper-ggml-base-en-v1

      - name: Install JS deps
        run: npm ci

      - name: Run the FULL gate (scripts/ci.sh incl. headless audio E2E)
        # No MURMUR_CI_SKIP_E2E → e2e-core.sh + e2e-mix.sh run. The provider step
        # falls back to a stub note when no `claude` CLI is present (as in CI).
        run: bash scripts/ci.sh
