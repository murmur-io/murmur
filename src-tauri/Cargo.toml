[package]
name = "murmur"
version = "0.3.2"
description = "Murmur — local meeting capture, transcription, and AI notes for Obsidian"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "Murmur"
path = "src/main.rs"

[lib]
name = "meetnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
# ── Tauri shell ──
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-global-shortcut = "2"

# ── Audio capture + WAV ──
cpal = "0.16"
hound = "3.5"
rubato = "0.16"

# ── Transcription ──
whisper-rs = { version = "0.16", features = ["metal"] }

# ── HTTP (Anthropic + Ollama providers) ──
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# ── Async runtime ──
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
async-trait = "0.1"

# ── Storage ──
# bundled-sqlcipher-vendored-openssl: whole-DB at-rest encryption, no system OpenSSL dependency
# (universal-capable). Fallback if the universal build breaks: "bundled-sqlcipher".
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# ── Serde ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Errors ──
anyhow = "1"
thiserror = "1"

# ── Secrets ──
keyring = { version = "3", features = ["apple-native"] }
getrandom = "0.2"
# `zeroize` feature: wipe the AES key schedule from memory on drop (C4/C5/C6 hardening).
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Scrub secret material (master KEK, content keys, hex PRAGMA-key strings, returned secrets) from
# RAM as soon as it is no longer needed. The `derive` feature pulls in `zeroize_derive` and
# re-exports `#[derive(ZeroizeOnDrop)]` from the `zeroize` crate root. User-approved new deps for
# the security audit (`zeroize` is already in the graph transitively via rustls).
zeroize = { version = "1", features = ["derive"] }
# Constant-time equality / conditional selection for secret comparisons (C4/C5/C6). User-approved.
subtle = "2"

# ── Misc ──
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── macOS biometric (Touch ID) + screen-share detection (Stage E) ──
# These objc2 crates are already in the dependency graph transitively (via tauri/tao);
# we pin the same 0.6/0.3 family. LocalAuthentication = Touch ID KEK gate.
# Screen-share auto-relock uses the PURE CoreGraphics C window-list API (no ObjC msg_send / no
# NSException risk): objc2-core-graphics CGWindow + objc2-core-foundation CFArray/CFDictionary/
# CFString for reading window owner + title. macOS-only — gated under cfg(target_os = "macos").
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFArray", "CFDictionary", "CFString"] }
# v0.3.2 — BIOMETRIC-GATED master KEK. The KEK is stored as a generic-password Keychain item with a
# kSecAttrAccessControl requiring user presence (Touch ID, device-passcode fallback). Reading it pops
# the system Touch ID sheet directly (with our reason string) — that single sheet IS the unlock auth,
# so no separate biometric prompt and no "app wants to use keychain, enter password" dialog. The
# high-level `security-framework` ItemAddOptions has no access-control setter, so we drop to the raw
# Security FFI (SecAccessControlCreateWithFlags + SecItemAdd/CopyMatching/Delete) via the -sys crate +
# core-foundation. All three are already in the dependency graph transitively (reqwest/rustls) — this
# only promotes them to direct deps, no new build cost. User-approved for v0.3.2.
core-foundation = "0.10"
# OSX_10_15 exposes `kSecUseDataProtectionKeychain` (propagated to security-framework-sys). That flag
# is MANDATORY: kSecAttrAccessControl (the user-presence gate on the KEK item) is only supported by
# the data-protection keychain — the legacy file-based keychain rejects it with errSecParam (-50), so
# without targeting the data-protection keychain the biometric-gated KEK item could never be created.
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[features]
# default keeps Metal on for whisper; nothing else conditional in P0
default = []
