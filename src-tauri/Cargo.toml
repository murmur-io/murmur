[package]
name = "murmur"
version = "2.6.0"
description = "Murmur — local meeting capture, transcription, and AI notes for Obsidian"
edition = "2021"
rust-version = "1.77"
# Murmur is a Tauri desktop app, never published to crates.io (it path-depends on
# murmur-protocol, which crates.io disallows). Declaring this lets `cargo deny`'s
# allow-wildcard-paths apply to the murmur-protocol path dep (bans check).
publish = false

[[bin]]
name = "Murmur"
path = "src/main.rs"

[lib]
name = "meetnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
# ── Tauri shell ──
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-global-shortcut = "2"

# ── Audio capture + WAV ──
cpal = "0.16"
hound = "3.5"
rubato = "0.16"
# Pure-Rust WebRTC audio processing (AEC3) — offline echo cancellation of the recorded mic
# using the captured system-audio track as the far-end reference. No C++ toolchain.
sonora = "0.1"
# CoreAudio C-function bindings (already compiled transitively via cpal) — crash-safe
# default-output introspection for the "you're on speakers" hint (rules §7: C funcs, no msg_send).
objc2-core-audio = "0.3"

# ── Transcription ──
whisper-rs = { version = "0.16", features = ["metal"] }
# Offline speaker diarization (#8). Bundles a STATIC onnxruntime built for macOS 13.4+, which is
# why minimumSystemVersion is 13.4. Linked in-process; the diarization path is opt-in + runs only
# on the system ("others") stream.
sherpa-onnx = "1.13"

# ── HTTP (Anthropic + Ollama providers) ──
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# ── Async runtime ──
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
async-trait = "0.1"

# ── Storage ──
# bundled-sqlcipher-vendored-openssl: whole-DB at-rest encryption, no system OpenSSL dependency
# (universal-capable). Fallback if the universal build breaks: "bundled-sqlcipher".
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# ── Local reasoning brain — EXTRACTED to the sibling member crate `crates/murmur-brain` ──
# mistralrs (in-process GGUF inference, Metal) NO LONGER links into this app crate: it was extracted
# into `crates/murmur-brain`, compiled to a killable helper binary `murmur-brain`. The app drives
# it through `reason::sidecar::SidecarReasoner` over the NDJSON protocol in `crates/murmur-brain/src/
# brain_ipc.rs` — so `cargo test --lib` stops compiling the largest single ML tree, and killing the
# child reclaims ALL model RAM to the OS (idle-unload / per-request timeout / app-quit). Model
# presence is still the ONLY switch: `reason::active_reasoner` (BrainBackend::Local) returns the
# `SidecarReasoner` when a GGUF is on disk, else the dependency-free `StubReasoner`.

# ── Vector retrieval (Phase 2a) ──
# sqlite-vec `vec0` virtual table for on-device KNN, registered into the SAME bundled SQLCipher
# handle via SQLite's auto-extension hook (db::register_vec_extension). Build-proven (de-risking
# spike) under bundled-sqlcipher-vendored-openssl on macOS; rusqlite 0.32 is on the good side of
# the #169 / 0.34 API break and load_extension is compiled in. No heavy ML dep: the embedding
# model is a deliberate later swap (the `Embedder` seam ships with a deterministic StubEmbedder).
sqlite-vec = "0.1.9"

# ── Local embedding model + NER (always compiled; the real impls activate at runtime when the model is present) ──
# In-process BERT embedding (candle-transformers, Metal) for the REAL multilingual-e5-small encoder
# behind `embed::active_embedder`, AND the mDeBERTa-v3 PERSON-name NER behind
# `summarize::redact::active_name_redactor`. A build-proof PROVED candle 0.10.2 links cleanly
# in-process with ZERO second onnxruntime, and sherpa stays the only ORT. (Since the mistralrs brain
# graph moved to `crates/murmur-brain`, candle is now the app crate's SOLE ML tree — a lighter
# `cargo test --lib`.) Always compiled: `embed::active_embedder` returns the real `CandleBertEmbedder`
# when the e5 model dir is present on disk, else the dependency-free `StubEmbedder`; likewise
# `active_name_redactor` returns the real `DebertaNameRedactor` when the NER model dir is present, else
# the byte-identical `NoopNameRedactor` (model presence is the ONLY switch — no cargo feature).
candle-core = { version = "0.10.2", features = ["metal", "accelerate"] }
candle-nn = { version = "0.10.2", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.10.2", features = ["metal", "accelerate"] }
tokenizers = { version = "0.21" }

# ── Serde ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Errors ──
anyhow = "1"
thiserror = "1"

# ── Secrets ──
keyring = { version = "3", features = ["apple-native"] }
getrandom = "0.2"
# `zeroize` feature: wipe the AES key schedule from memory on drop (C4/C5/C6 hardening).
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Scrub secret material (master KEK, content keys, hex PRAGMA-key strings, returned secrets) from
# RAM as soon as it is no longer needed. The `derive` feature pulls in `zeroize_derive` and
# re-exports `#[derive(ZeroizeOnDrop)]` from the `zeroize` crate root. User-approved new deps for
# the security audit (`zeroize` is already in the graph transitively via rustls).
zeroize = { version = "1", features = ["derive"] }
# Constant-time equality / conditional selection for secret comparisons (C4/C5/C6). User-approved.
subtle = "2"

# ── Client E2EE (Milestone M2 — sharing) ──
# Shared wire-format + envelope codec, compiled into BOTH the app and the server so format drift is
# a COMPILE error (spec §2/§4). Path-dep on the murmur-server workspace crate (permissive-licensed).
murmur-protocol = { path = "../../murmur-server/crates/murmur-protocol", features = ["opaque"] }
# HPKE RFC 9180 Base mode for the mode-B recipient NK wrap (DHKEM(X25519,HKDF-SHA256)+HKDF-SHA256+
# AES-256-GCM). rozbb/rust-hpke — Cloudflare-reviewed; pinned suite (spec §4.6/§4.8).
hpke = "0.12"
# Ed25519 detached signatures over the canonical identity bundle + share grant (spec §4.8). The
# `zeroize` feature wipes the signing seed on drop. Keys are built from raw seeds (`from_bytes`), so
# no `rand_core` keygen feature is needed. X25519 (enc) keys come from HPKE's own KEM (`sk_to_pk`),
# so no separate x25519-dalek dependency is required.
ed25519-dalek = { version = "2", features = ["zeroize"] }
# Argon2id password-hardening for the optional link-share password (spec §4.7).
argon2 = "0.5"
# HKDF-SHA256 for KEK_pw, KEK_link, and the L-derived fetch gate secret (spec §4.6).
hkdf = "0.12"
# SHA-256 of the content cell for the signed share-grant binding (spec §4.8).
sha2 = "0.10"
# BIP39 24-word recovery phrase (256-bit) for the recovery key RK (spec §4.3/§4.6).
bip39 = "2"
# OPAQUE (RFC 9807) CLIENT side (registration + login) for the sharing account (M3-CLIENT, spec §3).
# The ciphersuite MUST match the server VERBATIM (Ristretto255 + TripleDh<…, Sha512> + Argon2 KSF) —
# see `share/opaque_client.rs`. `argon2` feature = the Argon2id KSF. Same 4.0.1 the server resolves.
opaque-ke = { version = "4", features = ["argon2"] }
# CSPRNG source for HPKE seal / keypair generation (rand_core 0.6 ecosystem, matches hpke 0.12).
rand = "0.8"

# ── Universal document extraction (Brain v3 PR-2 — `src/extract/`) ──
# DOCX/PPTX are pure-Rust OOXML walks over the zip container + XML stream — NO parsing crate: `zip`
# and `quick-xml` are ALREADY compiled transitively (zip via candle-core, quick-xml via plist/tauri),
# here PROMOTED to direct deps pinned to the versions cargo already resolved (no new build cost).
zip = { version = "7", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# XLSX (sheet → pipe rows) and HTML (→ plain text). Both MIT-family, pure-Rust.
calamine = "0.36"
html2text = "0.17"

# ── Misc ──
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── macOS biometric (Touch ID) + screen-share detection (Stage E) ──
# These objc2 crates are already in the dependency graph transitively (via tauri/tao);
# we pin the same 0.6/0.3 family. The Touch ID gate moved to the Keychain user-presence ACL on the
# master KEK (secrets/keychain.rs), so LAContext/LAError are no longer referenced — the
# objc2-local-authentication dep was dropped (0.7 security-review fast-follow).
# Screen-share auto-relock uses the PURE CoreGraphics C window-list API (no ObjC msg_send / no
# NSException risk): objc2-core-graphics CGWindow + objc2-core-foundation CFArray/CFDictionary/
# CFString for reading window owner + title. macOS-only — gated under cfg(target_os = "macos").
[target.'cfg(target_os = "macos")'.dependencies]
# `exception` feature: `objc2::exception::catch` — Brain v3 PR-2 wraps EVERY PDFKit call so a stray
# ObjC NSException (e.g. a malformed/encrypted PDF) is CAUGHT and mapped to `AppError::InvalidArg`
# instead of unwinding across FFI and aborting the process (rules §7 crash-safe-FFI; the screenshare
# war story). A feature flip on an existing dep, no new crate.
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
# PDF text + outline extraction via Apple's PDFKit (same objc2 0.6/0.3 family we already ship; zero
# new binaries, no dylib to sign). Only the PDFDocument/PDFPage/PDFOutline/PDFDestination surface is
# needed — `src/extract/pdf.rs`. All calls wrapped in `objc2::exception::catch`. macOS-only.
# `objc2-core-graphics` feature: `PDFPage::drawWithBox:toContext:` — render a scanned page into the
# OCR bitmap context (Brain v3 OCR fallback in `src/extract/ocr.rs`).
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["PDFDocument", "PDFPage", "PDFOutline", "PDFDestination", "objc2-core-graphics"] }
# On-device OCR via Apple's Vision framework (Brain v3 — scanned-PDF + direct image import).
# Same objc2 0.3 family we already ship (Zlib/Apache/MIT); NO new binary, no dylib to sign.
# Only the text-recognition surface is compiled: VNRecognizeTextRequest (recognitionLevel/languages/
# usesLanguageCorrection), VNImageRequestHandler (initWithCGImage:options: / initWithData:options:),
# VNRecognizedTextObservation (topCandidates → VNRecognizedText.string). The `objc2-core-graphics`
# feature enables the CGImage handler init (we render a PDFPage into a CGBitmapContext for OCR).
# EVERY Vision/CoreGraphics/PDFKit call is wrapped in `objc2::exception::catch` (rules §7 crash-safe
# FFI — the screenshare.rs war story): a stray ObjC NSException is CAUGHT and mapped to a fail-closed
# `AppError::InvalidArg`, never an FFI abort. macOS-only — `src/extract/ocr.rs` + `src/extract/image.rs`.
objc2-vision = { version = "0.3", default-features = false, features = ["VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "objc2-core-graphics"] }
# `NSProcessInfo` feature: the typed `thermalState` binding for the live-loop thermal governor
# (`src/thermal.rs`) — a feature flip on an existing dep, no new crate. `NSData`/`NSDictionary`/`NSArray`
# feed the Vision OCR path (image bytes → NSData handler; empty options dict; the requests array).
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSProcessInfo", "NSURL", "NSData", "NSDictionary", "NSArray"] }
# `NSScreen`: the screen-share probe. `NSImage` + `NSImageRep` + `NSGraphicsContext` + the
# `objc2-core-graphics` feature: decode a standalone image FILE → CGImage
# (`NSImage::initWithContentsOfFile` → `CGImageForProposedRect:context:hints:`) so direct-image OCR
# runs the SAME proven `ocr_cgimage` path the scanned-PDF page uses — Vision's `initWithData` handler
# returns zero results on a valid PNG on this Mac, the CGImage handler does not. See `src/extract/ocr.rs`.
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSImage", "NSImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
# `CGContext`/`CGImage`/`CGColorSpace`/`CGBitmapContext`: render a PDFPage into an RGBX bitmap → CGImage
# for OCR (the scanned-PDF fallback). `CGWindow` is the screen-share window-list probe (screenshare.rs).
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGWindow", "CGContext", "CGImage", "CGColorSpace", "CGBitmapContext"] }
# `CFCGTypes` provides CGRect/CGPoint/CGSize (the PDFPage media box + the OCR bitmap rect) for the
# scanned-PDF renderer in `src/extract/ocr.rs`. CFArray/CFDictionary/CFString are the screen-share probe.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFArray", "CFDictionary", "CFString", "CFCGTypes"] }
# v0.3.2 — BIOMETRIC-GATED master KEK. The KEK is stored as a generic-password Keychain item with a
# kSecAttrAccessControl requiring user presence (Touch ID, device-passcode fallback). Reading it pops
# the system Touch ID sheet directly (with our reason string) — that single sheet IS the unlock auth,
# so no separate biometric prompt and no "app wants to use keychain, enter password" dialog. The
# high-level `security-framework` ItemAddOptions has no access-control setter, so we drop to the raw
# Security FFI (SecAccessControlCreateWithFlags + SecItemAdd/CopyMatching/Delete) via the -sys crate +
# core-foundation. All three are already in the dependency graph transitively (reqwest/rustls) — this
# only promotes them to direct deps, no new build cost. User-approved for v0.3.2.
core-foundation = "0.10"
# OSX_10_15 exposes `kSecUseDataProtectionKeychain` (propagated to security-framework-sys). That flag
# is MANDATORY: kSecAttrAccessControl (the user-presence gate on the KEK item) is only supported by
# the data-protection keychain — the legacy file-based keychain rejects it with errSecParam (-50), so
# without targeting the data-protection keychain the biometric-gated KEK item could never be created.
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[features]
# default keeps Metal on for whisper; nothing else conditional. The on-device brain (mistralrs) now
# lives in the `crates/murmur-brain` helper (NOT this crate); the embedder + NER (candle/tokenizers)
# are ALWAYS compiled here — the real impls activate at runtime on model-presence (see
# `reason::active_reasoner` → the brain sidecar, `embed::active_embedder`,
# `summarize::redact::active_name_redactor`), so there is no cargo feature to flip; a fresh install
# with no downloaded model still boots and runs on the stub/no-op floor.
default = []
