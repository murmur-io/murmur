# The build `[env]` (MACOSX_DEPLOYMENT_TARGET, MISTRALRS_METAL_PRECOMPILE) MOVED to the WORKSPACE
# ROOT `../.cargo/config.toml` (2026-07-11, brain-sidecar extraction) so the sibling
# `crates/murmur-brain` member — the crate that now owns mistralrs — also inherits it (cargo does not
# read a sibling member's `.cargo/config.toml`). A build started here still picks up the root config
# via upward config discovery, so nothing changes for `cd src-tauri && cargo ...`.
