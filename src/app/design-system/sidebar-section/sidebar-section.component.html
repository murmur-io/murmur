<div class="nav-row-expandable">
  @if (enableHeaderDrop()) {
    <!-- The header doubles as the vault-root DROP TARGET (Meetings) — the
         Notion/Obsidian pattern: dropping onto the section header files the
         note back to "no folder". -->
    <a
      class="nav-row-link"
      [routerLink]="routePath()"
      routerLinkActive="active"
      [attr.aria-label]="label()"
      appFolderDrop
      [dropFolderId]="null"
      (dropNote)="headerDropNote.emit($event)"
      (click)="headerSelect.emit()"
    >
      <mur-icon [icon]="icon()" />
      <span class="nav-label">{{ label() }}</span>
    </a>
  } @else {
    <a
      class="nav-row-link"
      [routerLink]="routePath()"
      routerLinkActive="active"
      [attr.aria-label]="label()"
      (click)="headerSelect.emit()"
    >
      <mur-icon [icon]="icon()" />
      <span class="nav-label">{{ label() }}</span>
    </a>
  }
  <button
    type="button"
    class="nav-row-add"
    (click)="addFolder.emit()"
    [attr.aria-label]="addFolderLabel()"
    title="New folder"
  >
    <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true">
      <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
  </button>
  <button
    type="button"
    class="nav-row-toggle"
    (click)="toggleExpanded.emit()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-label]="(expanded() ? 'Collapse ' : 'Expand ') + label() + ' folders'"
  >
    <svg
      class="group-chev"
      [class.open]="expanded()"
      viewBox="0 0 16 16"
      width="11"
      height="11"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 4.5 3.5 3.5L6 11.5" />
    </svg>
  </button>
</div>

@if (expanded()) {
  <ng-content />
}
