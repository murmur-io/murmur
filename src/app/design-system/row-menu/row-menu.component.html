<button
  type="button"
  class="row-menu-trigger"
  [class.is-open]="isOpen()"
  [disabled]="disabled()"
  [attr.aria-haspopup]="true"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="label()"
  [title]="label()"
  (click)="toggle()"
>
  @if (icon() === "add") {
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M8 3.6v8.8M3.6 8h8.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
  } @else {
  <!-- The app's existing settings/gear glyph (mirrors <mur-icon icon="settings">
       — a real toothed cog, not the old ⋯ kebab). -->
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.9" />
    <path
      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
      stroke="currentColor"
      stroke-width="1.9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  }
</button>

@if (isOpen()) {
  <!-- The global `.menu` primitive (design-system/primitives.css) — the SAME
       opaque `--surface-overlay` panel the note editor's own `⋯` menu uses
       (T3: never the frosted `.card`). Items are entirely content-projected. -->
  <div
    #panel
    class="menu row-menu-panel"
    [class.opens-above]="opensAbove()"
    [style.max-height.px]="panelMaxHeight()"
    role="menu"
    [attr.aria-label]="label()"
  >
    <ng-content />
  </div>
}
