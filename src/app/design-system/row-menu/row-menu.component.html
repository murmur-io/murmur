<button
  #trigger
  type="button"
  class="row-menu-trigger"
  [class.is-open]="isOpen()"
  [disabled]="disabled()"
  [attr.aria-haspopup]="true"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="label()"
  [title]="label()"
  (click)="onTriggerClick($event)"
  (keydown)="onTriggerKeydown($event)"
>
  <svg
    viewBox="0 0 20 20"
    width="15"
    height="15"
    fill="none"
    aria-hidden="true"
  >
    <circle cx="4.5" cy="10" r="1.35" fill="currentColor" />
    <circle cx="10" cy="10" r="1.35" fill="currentColor" />
    <circle cx="15.5" cy="10" r="1.35" fill="currentColor" />
  </svg>
</button>

@if (isOpen()) {
  <!-- The global `.menu` primitive (design-system/primitives.css) — the SAME
       opaque `--surface-overlay` panel the note editor's own `⋯` menu uses
       (T3: never the frosted `.card`). Items are entirely content-projected. -->
  <div
    #panel
    class="menu row-menu-panel"
    [class.is-positioned]="panelPositioned()"
    [style.left.px]="panelLeft()"
    [style.top.px]="panelTop()"
    [style.max-height.px]="panelMaxHeight()"
    appTeleportToBody
    appRepositionOnScroll
    [repositionAnchor]="trigger"
    (reposition)="onViewportChange()"
    role="menu"
    tabindex="-1"
    [attr.aria-label]="label()"
    (click)="onPanelClick($event)"
    (keydown)="onPanelKeydown($event)"
  >
    <ng-content />
  </div>
}
