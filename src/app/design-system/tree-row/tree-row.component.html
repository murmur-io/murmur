@if (expandable()) {
  <button
    type="button"
    class="caret"
    [class.is-open]="expanded()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-label]="(expanded() ? 'Collapse ' : 'Expand ') + label()"
    (click)="toggleExpand.emit()"
  >
    <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true">
      <path
        d="M4.5 2.5 8 6l-3.5 3.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>
} @else {
  <!-- Equal-width spacer: keeps icons aligned across expandable/leaf rows
       AND across both trees (see the class doc). -->
  <span class="caret caret--leaf" aria-hidden="true"></span>
}

<button
  type="button"
  class="row-main"
  [attr.aria-pressed]="selected()"
  (click)="activate.emit()"
>
  <span class="row-icon" [attr.data-icon]="icon()" aria-hidden="true">
    @if (emoji(); as glyph) {
      <span class="row-emoji">{{ glyph }}</span>
    } @else {
    @switch (icon()) {
      @case ("space") {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <rect x="1.8" y="1.8" width="5.2" height="5.2" rx="1.4" stroke="currentColor" stroke-width="1.3" />
          <rect x="9" y="1.8" width="5.2" height="5.2" rx="1.4" stroke="currentColor" stroke-width="1.3" />
          <rect x="1.8" y="9" width="5.2" height="5.2" rx="1.4" stroke="currentColor" stroke-width="1.3" />
          <rect x="9" y="9" width="5.2" height="5.2" rx="1.4" stroke="currentColor" stroke-width="1.3" />
        </svg>
      }
      @case ("meeting") {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.3" />
          <path d="M8 5.2V8l1.9 1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      }
      @case ("note") {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <path d="M4 2.6h5.2L12.4 6v7.4H4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          <path d="M9 2.8V6h3.2" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
        </svg>
      }
      @case ("task") {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <rect x="3" y="3" width="10" height="10" rx="2.2" stroke="currentColor" stroke-width="1.3" />
          <path d="m5.8 8.2 1.6 1.6 3-3.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
      @case ("dashboard") {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <rect x="2.6" y="2.6" width="4.6" height="4.6" rx="1.1" stroke="currentColor" stroke-width="1.3" />
          <rect x="8.8" y="2.6" width="4.6" height="7.2" rx="1.1" stroke="currentColor" stroke-width="1.3" />
          <rect x="2.6" y="8.8" width="4.6" height="4.6" rx="1.1" stroke="currentColor" stroke-width="1.3" />
        </svg>
      }
      @case ("locked") {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <rect x="3.5" y="7" width="9" height="6" rx="1.4" stroke="currentColor" stroke-width="1.3" />
          <path d="M5.5 7V5.4a2.5 2.5 0 0 1 5 0V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <path
            d="M1.75 4.25c0-.7.55-1.25 1.25-1.25h2.8c.4 0 .77.18 1 .5l.6.75h4.6c.7 0 1.25.55 1.25 1.25v5.5c0 .7-.55 1.25-1.25 1.25H3c-.7 0-1.25-.55-1.25-1.25z"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          />
        </svg>
      }
    }
    }
  </span>
  <span class="row-label" [title]="label()">{{ label() }}</span>
  @if (count() !== null && count()! > 0) {
    <span class="count row-count">{{ count() }}</span>
  }
</button>

<!-- Feature-specific trailing affordances (lock toggle, ⋯ menu, action
     cluster) — projected; the consumer owns their behavior + hover-reveal. -->
<ng-content />
