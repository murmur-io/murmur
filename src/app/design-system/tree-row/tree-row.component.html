@if (expandable()) {
  <button
    type="button"
    class="caret"
    [class.is-open]="expanded()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-label]="(expanded() ? 'Collapse ' : 'Expand ') + label()"
    (click)="toggleExpand.emit()"
  >
    <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true">
      <path
        d="M4.5 2.5 8 6l-3.5 3.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>
} @else {
  <!-- Equal-width spacer: keeps icons aligned across expandable/leaf rows
       AND across both trees (see the class doc). -->
  <span class="caret caret--leaf" aria-hidden="true"></span>
}

<button
  type="button"
  class="row-main"
  [attr.aria-pressed]="selected()"
  (click)="activate.emit()"
>
  <span class="row-icon" aria-hidden="true">
    @switch (icon()) {
      @case ("locked") {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <rect x="3.5" y="7" width="9" height="6" rx="1.4" stroke="currentColor" stroke-width="1.3" />
          <path d="M5.5 7V5.4a2.5 2.5 0 0 1 5 0V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
          <path
            d="M1.75 4.25c0-.7.55-1.25 1.25-1.25h2.8c.4 0 .77.18 1 .5l.6.75h4.6c.7 0 1.25.55 1.25 1.25v5.5c0 .7-.55 1.25-1.25 1.25H3c-.7 0-1.25-.55-1.25-1.25z"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          />
        </svg>
      }
    }
  </span>
  <span class="row-label" [title]="label()">{{ label() }}</span>
  @if (count() !== null && count()! > 0) {
    <span class="count row-count">{{ count() }}</span>
  }
</button>

<!-- Feature-specific trailing affordances (lock toggle, ⋯ menu, action
     cluster) — projected; the consumer owns their behavior + hover-reveal. -->
<ng-content />
