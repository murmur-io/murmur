<!-- One control for the four tool drawers — the same `.seg.seg--icon` primitive
     the view switcher beside it uses. Each item keeps the accessible name and
     the `aria-expanded` it carried as a standalone toggle, so tooltips, screen
     readers and every existing locator are unchanged; only the painted form
     and the grouping differ. -->
<div class="seg seg--icon" role="group" aria-label="Meeting tools">
  @for (t of tools(); track t.id) {
    <button
      type="button"
      class="seg-btn"
      [class.has-label]="t.showLabel"
      [class.is-active]="active() === t.id"
      [appTooltip]="t.hint"
      [attr.aria-label]="t.showLabel ? null : t.label"
      [attr.aria-expanded]="active() === t.id"
      (click)="toolChange.emit(t.id)"
    >
      @switch (t.id) {
        @case ("actions") {
          <!-- Ticked list: the follow-ups this meeting produced. -->
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path
              d="M2.8 4.7 4.5 6.4 7.2 3.5M2.8 12.6l1.7 1.7 2.7-2.9"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M9.7 5.2h5.6M9.7 13.1h5.6"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        }
        @case ("live") {
          <!-- Broadcast: context fetched from the user's connectors. -->
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="2" fill="currentColor" />
            <path
              d="M5.6 12.4a4.8 4.8 0 0 1 0-6.8M12.4 5.6a4.8 4.8 0 0 1 0 6.8"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
            <path
              d="M3.3 14.7a8 8 0 0 1 0-11.4M14.7 3.3a8 8 0 0 1 0 11.4"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
          </svg>
        }
        @case ("smart") {
          <!-- Sparkle-on-bell: the SUGGESTED sibling of the plain checklist. -->
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path
              d="M8.6 3.3a3.8 3.8 0 0 0-3.8 3.8v2L3.6 11.4h10l-1.2-2.3v-2a3.8 3.8 0 0 0-3.8-3.8Z"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linejoin="round"
            />
            <path
              d="M7.1 13.3a1.6 1.6 0 0 0 3 0"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
            <path
              d="m14.6 2 .5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4-1.4-.5 1.4-.5.5-1.4Z"
              fill="currentColor"
            />
          </svg>
        }
        @default {
          <!-- Spark: ask this meeting a question. -->
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M8 1.5l1.3 3.2L12.5 6 9.3 7.3 8 10.5 6.7 7.3 3.5 6l3.2-1.3L8 1.5Z"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linejoin="round"
            />
            <path
              d="M12.5 10.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6.6-1.4Z"
              stroke="currentColor"
              stroke-width="1.1"
              stroke-linejoin="round"
            />
          </svg>
        }
      }
      <!-- An icon-only item names itself with `aria-label`, exactly as it did
           as a standalone toggle: four other spec files (and any voice-control
           user) address these by their EXACT name, and leaving the name to be
           computed from a visually-hidden span plus a `title` would have been
           a guess about accname precedence in the one place a wrong guess
           renames four controls at once. A labelled item needs no such
           attribute — its own text is the name. -->
      @if (t.showLabel) {
        {{ t.label }}
      }
    </button>
  }
</div>
