<div class="brain-card">
  <div class="brain-row">
    <div class="brain-main">
      <span class="brain-name">On this Mac — built-in models</span>
      @if (ready()) {
        <span class="pill is-success">
          <span class="pill-dot"></span>
          Ready
        </span>
      } @else {
        <span class="pill">
          <span class="pill-dot"></span>
          No model downloaded
        </span>
      }
      @if (inUse()) {
        <span class="pill brain-inuse">
          <span class="pill-dot"></span>
          In use now
        </span>
      }
    </div>
    <button
      type="button"
      class="btn btn-sm"
      (click)="toggle()"
      [attr.aria-expanded]="expanded()"
    >
      Configure
      <svg
        class="brain-chevron"
        [class.is-open]="expanded()"
        viewBox="0 0 16 16"
        width="12"
        height="12"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M4 6.5 8 10.5 12 6.5" />
      </svg>
    </button>
  </div>
  <span class="brain-privacy text-muted">
    Built into Murmur — managed models, nothing leaves this Mac. Powers
    Realtime reactions and the Fully local posture.
  </span>
  @if (expanded()) {
    <div class="brain-config">
      <app-model-effort-picker />
    </div>
  }
</div>
