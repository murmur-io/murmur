<div
  class="bar"
  [class.is-recording]="store.isRecording()"
  [class.is-processing]="isProcessing()"
>
  @if (store.isRecording()) {
    <span class="orb live" data-tauri-drag-region aria-hidden="true"></span>
    <span class="timer" data-tauri-drag-region>{{ elapsedLabel() }}</span>
    @if (caption(); as cc) {
      <span
        class="wave is-compact"
        [style.--level]="store.level()"
        aria-hidden="true"
      >
        @for (b of compactBars; track b) {
          <span class="wbar" [style.--i]="b"></span>
        }
      </span>
      <span class="cc" aria-live="polite" [title]="cc">{{ cc }}</span>
    } @else {
      <div class="wave" [style.--level]="store.level()" aria-hidden="true">
        @for (b of bars; track b) {
          <span class="wbar" [style.--i]="b"></span>
        }
      </div>
    }
    <!-- Mic-mute: icon-only in the slim pill. Silences only the mic;
         system audio keeps recording. Never starts/stops anything. -->
    <app-mic-mute-toggle [compact]="true" />
    <button
      type="button"
      class="circle stop"
      (click)="store.stop()"
      aria-label="Stop recording"
    >
      <span class="sq" aria-hidden="true"></span>
    </button>
  } @else if (isProcessing()) {
    <span class="orb proc" data-tauri-drag-region aria-hidden="true"></span>
    <span class="label proc-label" data-tauri-drag-region>{{
      store.message() || store.stage()
    }}</span>
    <div class="track" aria-hidden="true"><div class="shim"></div></div>
  } @else {
    <span class="grip" data-tauri-drag-region aria-hidden="true">
      <i></i><i></i>
    </span>
    <span
      class="orb ready"
      data-tauri-drag-region
      aria-hidden="true"
    ></span>
    <label class="destination-field">
      <span class="sr-only">Save recording in</span>
      <select
        class="destination-picker"
        aria-label="Recording destination"
        data-testid="bar-recording-destination"
        [value]="selectedDestinationId() ?? ''"
        [disabled]="store.isBusy()"
        (change)="selectDestination($event)"
      >
        <option value="">— Unfiled · Default</option>
        @for (destination of destinations(); track destination.id) {
          <option
            [value]="destination.id"
            [disabled]="destination.blocked"
            [attr.data-testid]="'bar-destination-' + destination.id"
          >
            @if (destination.emoji) {
              {{ destination.emoji }}
            } @else if (destination.level === "project") {
              ▦
            } @else {
              ▱
            }
            {{ destination.level === "project" ? "Workspace" : "Folder" }} ·
            {{ destination.label }}{{ destination.blocked ? " · Locked" : "" }}
          </option>
        }
      </select>
    </label>
    <span class="kbd" data-tauri-drag-region aria-hidden="true">⌘⇧R</span>
    <button
      type="button"
      class="circle rec"
      (click)="startSelected()"
      [disabled]="store.isBusy() || !destinationReady()"
      aria-label="Start recording"
    >
      <span class="dot" aria-hidden="true"></span>
    </button>
  }
</div>
