<div class="board" role="list">
  @for (group of groups(); track trackByGroup(group)) {
    <section class="board-col" role="listitem">
      <header class="board-col-head">
        <span class="board-col-title">{{ group.label }}</span>
        <span class="count">{{ group.rows.length }}</span>
      </header>
      <div class="board-col-body">
        @for (row of group.rows; track trackByRow(row)) {
          @let m = row.meeting;
          <mur-card class="board-card">
            <button
              type="button"
              class="board-card-btn"
              (click)="onOpen($event, m)"
            >
              <span class="board-card-title-row">
                @if (folderExposureOf()(m); as exp) {
                  <app-lock-badge [exposure]="exp" />
                }
                @if (isMasked()(m)) {
                  <span class="board-card-title board-card-title--masked" aria-hidden="true"
                    >•••••••••••</span
                  >
                  <span class="sr-only">Locked note — title hidden</span>
                } @else {
                  <span class="board-card-title">{{ m.title || "(untitled)" }}</span>
                }
              </span>
              <span class="board-card-meta">
                <span class="date">{{ formatDate(m.startedAt) }}</span>
                @if (folderNameOf()(m); as fname) {
                  <span class="dot" aria-hidden="true">·</span>
                  <span class="folder">{{ fname }}</span>
                }
              </span>
              <span class="board-card-foot">
                <span class="pill" [class]="statusPillClass(m.status)">
                  <span class="pill-dot"></span>
                  {{ statusLabel(m.status) }}
                </span>
                @if (row.openCount > 0 || row.doneCount > 0) {
                  <span class="board-card-actions">
                    <span class="pill is-warning" title="Open action items"
                      >{{ row.openCount }} open</span
                    >
                    <span class="pill is-success" title="Completed action items"
                      >{{ row.doneCount }} done</span
                    >
                  </span>
                }
              </span>
            </button>
          </mur-card>
        } @empty {
          <p class="board-col-empty text-muted">No meetings</p>
        }
      </div>
    </section>
  }
</div>
