@switch (exposure()) {
  @case ("locked") {
    <!-- Closed padlock: sealed, not visible this session. -->
    <svg
      viewBox="0 0 16 16"
      width="13"
      height="13"
      fill="none"
      aria-hidden="true"
    >
      <rect
        x="3.25"
        y="7"
        width="9.5"
        height="6.5"
        rx="1.6"
        stroke="currentColor"
        stroke-width="1.4"
      />
      <path
        d="M5.25 7V5.25a2.75 2.75 0 0 1 5.5 0V7"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
      />
      <circle cx="8" cy="10.1" r="1.05" fill="currentColor" />
    </svg>
  }
  @case ("session") {
    <!-- Open padlock: session-unlocked (plaintext visible until relock). -->
    <svg
      viewBox="0 0 16 16"
      width="13"
      height="13"
      fill="none"
      aria-hidden="true"
    >
      <rect
        x="3.25"
        y="7"
        width="9.5"
        height="6.5"
        rx="1.6"
        stroke="currentColor"
        stroke-width="1.4"
      />
      <path
        d="M5.25 7V5.25a2.75 2.75 0 0 1 5.4-0.7"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
      />
      <circle cx="8" cy="10.1" r="1.05" fill="currentColor" />
    </svg>
  }
  @default {
    <!-- Open folder: no lock; a faint dot holds the slot. -->
    <span class="open-dot" aria-hidden="true"></span>
  }
}
