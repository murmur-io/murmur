<!-- The "All meetings" ROOT ROW (+ its drop-target behavior) now lives in
     <mur-sidebar-section> (2026-07-12 consolidation — see
     MeetingsSidebarTreeComponent/AppShellComponent). This template owns only
     the folder tree itself, at every depth. -->
<div class="tree" [class.is-root]="isRoot()">
  @for (node of nodes(); track node.id) {
    <app-folder-row
      [node]="node"
      [selectedId]="selectedId()"
      [depth]="depth()"
      [selectionActive]="selectionActive()"
      (selected)="selected.emit($event)"
      (dropNote)="dropNote.emit($event)"
    />
  } @empty {
    @if (isRoot()) {
      <p class="tree-empty">No folders yet.</p>
    }
  }

  @if (isRoot()) {
    <!-- Inline "New folder" create (afterNextRender focus; not setTimeout) -->
    @if (creating()) {
      <form
        class="new-folder"
        [class.is-saving]="saving()"
        (submit)="confirmCreate($event)"
      >
        <span class="new-folder-icon" aria-hidden="true">
          @if (saving()) {
            <span class="new-folder-spinner"></span>
          } @else {
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none">
              <path
                d="M1.75 4.25c0-.7.55-1.25 1.25-1.25h2.8c.4 0 .77.18 1 .5l.6.75h4.6c.7 0 1.25.55 1.25 1.25v5.5c0 .7-.55 1.25-1.25 1.25H3c-.7 0-1.25-.55-1.25-1.25z"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
            </svg>
          }
        </span>
        <input
          #nameInput
          type="text"
          class="new-folder-input"
          placeholder="Folder name…"
          autocomplete="off"
          spellcheck="false"
          aria-label="New folder name"
          [value]="draftName()"
          [disabled]="saving()"
          (input)="onNameInput($event)"
          (keydown.escape)="cancelCreate()"
        />
        <button
          type="submit"
          class="btn btn-primary new-folder-add"
          [disabled]="saving() || !draftName().trim()"
        >
          {{ saving() ? "Adding…" : "Add" }}
        </button>
        <button
          type="button"
          class="new-folder-cancel"
          aria-label="Cancel new folder"
          [disabled]="saving()"
          (click)="cancelCreate()"
        >
          <svg
            viewBox="0 0 16 16"
            width="13"
            height="13"
            aria-hidden="true"
          >
            <path
              d="M4 4l8 8M12 4l-8 8"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </form>
      <p class="new-folder-hint" aria-hidden="true">
        Enter to create · Esc to cancel
      </p>
    }
    <!-- The entry TRIGGER for this create field is now the compact "+" icon
         next to the "Meetings" section header (AppShellComponent,
         2026-07-12) — see `openCreate()`'s doc comment. Only the inline
         field above (shown while `creating()`) still lives here. -->
  }
</div>
