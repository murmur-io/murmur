<!-- The "All notes" ROOT ROW now lives in <mur-sidebar-section> (2026-07-12
     consolidation — this component projects into it, see AppShellComponent).
     This template owns only the note-FOLDER list below it. -->
<nav class="notes-tree" aria-label="Note folders">
  @for (folder of noteFolders(); track folder.id) {
    @if (renamingId() === folder.id) {
      <form class="tree-edit" (submit)="confirmRename(folder.id, $event)">
        <input
          class="tree-edit-input"
          type="text"
          [value]="renameDraft()"
          (input)="renameDraft.set($any($event.target).value)"
          [attr.aria-label]="'Rename folder ' + folder.name"
          autocomplete="off"
        />
        <div class="tree-edit-actions">
          <button type="submit" class="btn btn-primary btn-tiny" [disabled]="folderBusy()">Save</button>
          <button type="button" class="btn btn-ghost btn-tiny" (click)="cancelFolderEdits()">Cancel</button>
        </div>
      </form>
    } @else if (pendingDeleteId() === folder.id) {
      <div class="tree-confirm">
        <span class="tree-confirm-copy text-secondary">
          Delete “{{ folder.name }}”? Its notes move to your default folder.
        </span>
        <div class="tree-edit-actions">
          <button
            type="button"
            class="btn btn-danger btn-tiny"
            [disabled]="folderBusy()"
            (click)="confirmDeleteFolder(folder.id)"
          >
            Delete
          </button>
          <button type="button" class="btn btn-ghost btn-tiny" (click)="cancelFolderEdits()">Cancel</button>
        </div>
      </div>
    } @else {
      <!-- The ROW VISUAL is the shared <mur-tree-row> (design-system,
           2026-07-12 — the SAME component the Meetings tree's rows render
           through, so the two can never diverge again). Only the trailing
           action cluster below is this component's own. -->
      <mur-tree-row
        [label]="folder.name"
        [icon]="folder.locked ? 'locked' : 'folder'"
        [selected]="sectionActive() && activeFolderId() === folder.id"
        (activate)="select(folder.id)"
      >
        <div class="tree-actions">
          @if (folder.locked) {
            <button
              type="button"
              class="tree-act"
              [disabled]="lockBusyId() === folder.id"
              (click)="unlockFolder(folder, $event)"
              aria-label="Unlock folder"
              title="Unlock"
            >
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true">
                <rect x="3.5" y="7" width="9" height="6" rx="1.4" stroke="currentColor" stroke-width="1.3" />
                <path d="M5.5 7V5.4a2.5 2.5 0 0 1 4.6-0.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              </svg>
            </button>
          } @else {
            <button
              type="button"
              class="tree-act"
              [disabled]="lockBusyId() === folder.id"
              (click)="lockFolder(folder, $event)"
              aria-label="Lock folder"
              title="Lock"
            >
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true">
                <rect x="3.5" y="7" width="9" height="6" rx="1.4" stroke="currentColor" stroke-width="1.3" />
                <path d="M5.5 7V5.4a2.5 2.5 0 0 1 5 0V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              </svg>
            </button>
          }
          <button
            type="button"
            class="tree-act"
            (click)="startRename(folder, $event)"
            aria-label="Rename folder"
            title="Rename"
          >
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true">
              <path d="M11 2.7l2.3 2.3-7.4 7.4-2.8.6.6-2.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            </svg>
          </button>
          <button
            type="button"
            class="tree-act tree-act--danger"
            (click)="askDeleteFolder(folder, $event)"
            aria-label="Delete folder"
            title="Delete"
          >
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true">
              <path d="M4 4.5h8M6.5 4.5V3.2h3v1.3M5 4.5l.5 8h5l.5-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </mur-tree-row>
    }
  }

  @if (creatingFolder()) {
    <form class="tree-edit" (submit)="confirmCreateFolder($event)">
      <input
        #folderInput
        class="tree-edit-input"
        type="text"
        [value]="folderDraft()"
        (input)="folderDraft.set($any($event.target).value)"
        placeholder="Folder name"
        aria-label="New folder name"
        autocomplete="off"
      />
      <div class="tree-edit-actions">
        <button type="submit" class="btn btn-primary btn-tiny" [disabled]="folderBusy()">Create</button>
        <button type="button" class="btn btn-ghost btn-tiny" (click)="cancelFolderEdits()">Cancel</button>
      </div>
    </form>
  }
  <!-- The entry TRIGGER for the field above is now the compact "+" icon next
       to the "Notes" section header (AppShellComponent, 2026-07-12) — see
       `startCreateFolder()`'s doc comment. -->
</nav>
